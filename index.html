<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="description" content="Demonstração do Prime Frotas, sistema de gestão de frotas, com dados fictícios.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Frotas — Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --primary:#56e1c6; --primary-ink:#0b3b33; --primary-strong:#1aa98d;
  --accent:#5f6368; --sidebar:#72dfd8; --sidebar-ink:#10302b;
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#f7f9fa; --text:#14191d; --muted:#6b7480;
  --line:#e5e9ee; --danger:#e03131; --danger-soft:#fde8e8; --ok:#15a34a; --ok-soft:#e3f7ea;
  --warn:#e8870e; --warn-soft:#fff1de; --purple:#7c3aed; --purple-soft:#efe7ff; --red:#c8102e;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1417; --surface:#172026; --surface-2:#1c272e; --text:#e8eef2; --muted:#98a6b1; --line:#2a363e;
    --danger-soft:#3a1d1f; --ok-soft:#173424; --warn-soft:#3a2a14; --purple-soft:#2a2140;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#172026; --surface-2:#1c272e; --text:#e8eef2; --muted:#98a6b1; --line:#2a363e;
  --danger-soft:#3a1d1f; --ok-soft:#173424; --warn-soft:#3a2a14; --purple-soft:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;}
#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Roboto",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Roboto Condensed","Roboto",Arial Narrow,Arial,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--primary-strong);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.sidebar{background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;height:100%;min-height:0;position:sticky;top:0}
.brand{display:flex;gap:12px;align-items:center;padding:16px 16px 14px}
.brand-logo{width:56px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-family:"Roboto Condensed",Arial,sans-serif;font-size:17px;line-height:1.1}
.brand small{font-size:12px;opacity:.75;font-weight:500}
.nav{flex:1;overflow:auto;padding:6px 8px;border-top:1px solid rgba(0,0,0,.06)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;text-decoration:none;font-size:14px;color:var(--sidebar-ink);margin-bottom:2px}
.nav a .code{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;flex:none}
.nav a:hover{background:rgba(255,255,255,.35)}
.nav a.active{background:var(--surface);color:var(--primary-strong);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav a.active .code{background:var(--surface-2);color:var(--primary-strong);border:1px solid var(--line)}
.userbox{margin:10px;background:var(--surface);color:var(--text);border-radius:14px;padding:12px}
.userbox small{color:var(--muted);font-size:12px}
.userbox b{display:block;font-family:"Roboto Condensed",Arial,sans-serif;font-size:14px;text-transform:uppercase;margin:2px 0 10px}
.main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:auto}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.topbar .org b{display:block;font-family:"Roboto Condensed",Arial,sans-serif;font-size:15px}
.topbar .org span{font-size:12px;color:var(--muted);text-transform:uppercase}
.topbar .spacer{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;cursor:pointer}
.demo-strip{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);padding:8px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-strip b{color:var(--text)}
.content{padding:24px;max-width:1480px;width:100%}
.scrim{display:none}

/* ---------- Page header ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.page-head h1{font-size:34px;line-height:1.1;margin:4px 0 2px}
.page-head p{margin:0;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons & pills ---------- */
.btn{border:1px solid transparent;background:var(--primary);color:var(--primary-ink);font-weight:600;border-radius:12px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;font-size:13.5px}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn.soft{background:var(--surface-2);border-color:var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:13px;color:var(--primary-strong)}
.link.danger{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.online{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag{display:inline-block;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.purple{background:var(--purple-soft);color:var(--purple);border-color:transparent}
.tag.mint{background:color-mix(in srgb,var(--primary) 22%,transparent);color:var(--primary-strong);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--primary-strong)}
.chip:hover{background:var(--surface-2)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.kpi{position:relative;padding:16px 18px}
.kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:"Roboto Condensed",Arial,sans-serif;font-size:30px;font-weight:700;margin:6px 0 2px;line-height:1.1}
.kpi .cap{font-size:12.5px;color:var(--muted)}
.kpi .ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--primary) 22%,transparent)}
.kpi .ico.gray{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.kpi .ico.purple{background:var(--purple-soft)}
.kpi .ico.red{background:var(--danger-soft)}
.kpi .ico.green{background:var(--ok-soft)}
.section-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary-strong)}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:300px}
.chart-box.short{height:210px}

/* ---------- Forms ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--text)}
.field label .req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:2px solid color-mix(in srgb,var(--primary) 60%,transparent);border-color:var(--primary-strong)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:color-mix(in srgb,var(--primary) 20%,var(--surface));border-color:var(--primary-strong);color:var(--primary-strong);font-weight:600}
.seg button.on.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.seg button::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.seg button.on::before{background:currentColor;box-shadow:inset 0 0 0 2px var(--surface)}
.err{color:var(--danger);font-size:12px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:11.5px}
td b{font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:12px;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:180px}
.col.drag{outline:2px dashed var(--primary-strong)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;gap:8px}
.col-head b{display:flex;align-items:center;gap:8px;font-family:"Roboto Condensed",Arial,sans-serif;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow)}
.kcard h4{font-size:15px;margin:6px 0 4px}
.kcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0;font-size:12px}
.kcard dt{color:var(--muted)}
.kcard dd{margin:0;font-weight:500}

/* ---------- Company / checklist cards ---------- */
.company{border-top:4px solid var(--text)}
.ring-row{display:flex;align-items:center;gap:16px}
.ring-row .chart-box{height:120px;width:140px;flex:none}
.stat-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.progress i.warn{background:var(--warn)}
.icard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icard h4{font-size:15px;margin:8px 0 2px}
.icard .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px;font-size:12px}
.icard .meta b{display:block;font-size:14px}
.icard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

/* ---------- Checklist form ---------- */
.q{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.q.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 4%,var(--surface))}
.q h4{font-size:14px;margin-bottom:8px;font-family:"Roboto",Arial,sans-serif;font-weight:600}
.evid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.evid .drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;position:relative;overflow:hidden}
.evid .drop.need{border-color:var(--danger)}
.evid .drop img{width:100%;height:96px;object-fit:cover;border-radius:6px}
.evid .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.map-wrap{position:relative;border-radius:12px;background:#1f2328;overflow:hidden;cursor:crosshair;user-select:none;max-width:560px;margin:0 auto}
.map-wrap.light{background:#f2f4f6}
.map-wrap svg{display:block;width:100%;height:auto}
.marker{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#e03131;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.tabs button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.avaria{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2)}

/* ---------- Timeline ---------- */
.tl-day{margin:18px 0 8px;font-weight:700;display:flex;gap:8px;align-items:center}
.tl-day::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary-strong)}
.tl-item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;margin-left:14px}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--ok-soft);color:var(--ok)}
.avatar.ma{background:var(--warn-soft);color:var(--warn)}
.avatar.ab{background:#e3edff;color:#2958d6}
.avatar.mint{background:color-mix(in srgb,var(--primary) 40%,var(--surface));color:var(--primary-ink)}
.tl-item .time{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- Personalização preview ---------- */
.preview{display:grid;grid-template-columns:150px 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:220px}
.preview .pv-side{padding:12px;display:flex;flex-direction:column;gap:8px}
.preview .pv-side span{background:rgba(255,255,255,.55);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600}
.preview .pv-main{padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;cursor:pointer}

/* ---------- Users ---------- */
.ucard{display:grid;grid-template-columns:auto 1fr;gap:12px}
.ucard .row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ucard .info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ucard .info div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12.5px}
.ucard .info small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ucard .btns{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- Modal & toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,20,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:18px;width:min(720px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line);gap:12px}
.modal-head h3{font-size:20px}
.modal-body{padding:16px 20px;overflow:auto}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:340px}
.toast.err{background:var(--danger-soft);color:var(--danger)}

/* ---------- Login ---------- */
.login{min-height:100%;height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--sidebar);color:var(--sidebar-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login-art h2{font-size:44px;line-height:1.05;max-width:13ch}
.login-art p{max-width:46ch;font-size:15px}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.login-form .card{width:min(420px,100%);padding:28px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
  .menu-btn{display:grid;place-items:center}
  .g2,.kanban{grid-template-columns:1fr}
  .login{grid-template-columns:1fr;height:auto}
  .login-art{padding:28px}
  .login-art h2{font-size:32px}
  .topbar{padding:10px 14px}
  .content{padding:16px}
  .demo-strip{padding:8px 14px}
}
@media (max-width:600px){
  .g4,.g3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .ucard .info,.ucard .btns{grid-template-columns:1fr}
  .topbar .pill:not(.online){display:none}
  .page-head h1{font-size:28px}
  .evid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
/* ===== Utilitários ===== */
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
// Datas guardadas como AAAA-MM-DD e lidas no fuso local (evita o "dia a menos").
function parseISO(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
const fmtDate = s => { if (!s) return "—"; const d = parseISO(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDateTime = s => { if (!s) return "—"; const d = new Date(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTime = s => { const d = new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const BRL = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const NUM = (v, dec = 0) => (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function hexToRgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(h) { const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; }
function shade(h, t) { const c = hexToRgb(h).map(v => Math.round(v * (1 - t))); return "#" + c.map(v => v.toString(16).padStart(2, "0")).join(""); }
function applyCfg(cfg = CFG) {

  s.setProperty("--accent", cfg.accent);

}

function toast(msg, kind = "ok") {
  const box = document.getElementById("toasts"); const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : ""); el.setAttribute("role", "status"); el.textContent = msg; box.appendChild(el);

let modalOnClose = null;
function openModal({ title, sub = "", body, foot = "", wide = false, onMount, onClose }) {
  closeModal();
  const wrap = document.createElement("div"); wrap.className = "modal-back"; wrap.id = "modal";
  wrap.innerHTML = `<div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="modal-head"><div>${sub ? `<div class="section-label">${sub}</div>` : ""}<h3 id="mtitle">${title}</h3></div><button class="link" data-close>Fechar</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ""}</div>`;
  wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(wrap); modalOnClose = onClose || null;
  const f = wrap.querySelector("input,select,textarea,button:not([data-close])"); if (f) f.focus();
  if (onMount) onMount(wrap);
  return wrap;
}
function closeModal() { const m = document.getElementById("modal"); if (m) { m.remove(); if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); } } }
function confirmBox(msg, onYes, yes = "Excluir") {

    onMount: w => w.querySelector("#yes").onclick = () => { closeModal(); onYes(); } });
}
let dlPromise = null;
function getDownloads() { if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null); return dlPromise; }
async function saveFile(filename, data) {
  const dl = await getDownloads();
  if (!dl) { // Fora do Claude (ex.: Vercel): download padrão do navegador
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".json") ? "application/json" : filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/octet-stream" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`Arquivo gerado: ${filename}`); return; }
  try { await dl.save({ filename, data }); toast(`Arquivo gerado: ${filename}`); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Já existe um download aguardando confirmação." : "Não foi possível gerar o arquivo.", "err"); }
}

      <dl><dt>Tipo</dt><dd>${m.tipo}</dd><dt>Programada</dt><dd>${fmtDate(m.programada)}</dd><dt>Custo</dt><dd>${BRL(manCost(m))}</dd><dt>Fornecedor</dt><dd>${esc(m.fornecedor || "—")}</dd><dt>Responsável</dt><dd>${esc(m.responsavel)}</dd></dl>
      <div class="field"><label for="mv-${m.id}">Mover para</label><select class="input" id="mv-${m.id}" data-move="${m.id}">${opts(Object.entries(MAN_STATUS), k)}</select></div>

  <div class="grid g4" style="margin-bottom:14px">${kpi("Colocar para manutenção", list.filter(m => m.status === "colocar").length, "aguardando encaminhamento", "purple")}${kpi("Em manutenção", list.filter(m => m.status === "andamento").length, "serviços em execução", "gray")}${kpi("Em conformidade", list.filter(m => m.status === "conformidade").length, "serviços regularizados", "green")}${kpi("Custo registrado", BRL(list.reduce((s, m) => s + manCost(m), 0)), "ordens listadas")}</div>

    <div class="field"><label for="mv">Veículo</label><select class="input" id="mv">${opts(vehOpts(), f.veiculo, "Todos os veículos")}</select></div>
    <div class="field"><label for="mc">Centro de custo</label><select class="input" id="mc">${opts(cenOpts(), f.centro, "Todos os centros")}</select></div>
    <div class="field"><label for="mE">Empresa</label><select class="input" id="mE">${opts(empOpts(), f.empresa, "Todas as empresas")}</select></div>

      col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("drag"); moveMan(e.dataTransfer.getData("text/plain"), col.dataset.col); });
    });

};
function moveMan(id, status) {
  const m = byId("manutencoes", id); if (!m || m.status === status) return;
  m.status = status; const v = veic(m.veiculo);
  if (status === "andamento") { m.inicio = m.inicio || T0; if (v.id) v.status = "Em manutenção"; }
  if (status === "conformidade") { m.conclusao = T0; if (v.id && !DB.manutencoes.some(x => x.veiculo === v.id && x.status === "andamento")) v.status = "Ativo"; }
  if (status === "colocar") { m.conclusao = ""; }
  audit("Manutenções", "MA", `atualizou a manutenção “${m.titulo}”`, `${v.placa} · ${MAN_STATUS[status]} · ${m.fornecedor || "sem fornecedor"}`); save();
  rerender(); toast(`Manutenção movida para ${MAN_STATUS[status]}.`);
}

  return { html, after: () => {
    chart("k1", { type: "doughnut", data: { labels: ["Em conformidade", "Requer atenção"], datasets: [{ data: [okN, list.length - okN], backgroundColor: ["#15a34a", "#e8870e"], borderWidth: 2, borderColor: css("--surface") }] }, options: { cutout: "60%" } });

function readPhoto(file, cb) {
  const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); cb(cv.toDataURL("image/jpeg", .72)); }; img.onerror = () => toast("Não foi possível ler essa imagem. Tente outra foto.", "err"); img.src = fr.result; }; fr.readAsDataURL(file);
}

}
function svgWithMarks(tipo, vista, marks, all) {

function openForm(entity, id) {

    const value = v[k] ?? (type === "date" ? T0 : ""); const lab = `<label for="f-${k}">${l}${req ? ' <span class="req">*</span>' : ""}</label>`;

    else if (type === "textarea") input = `<textarea class="input" id="f-${k}">${esc(value)}</textarea>`;
    else if (type === "list") input = `<input class="input" id="f-${k}" value="${esc((value || []).join ? value.join(", ") : value)}">`;
    else input = `<input class="input" id="f-${k}" type="${type}" ${type === "number" ? 'step="any" inputmode="decimal"' : ""} value="${esc(value)}">`;
    return `<div class="field${full ? " full" : ""}">${lab}${input}<span class="err hidden" id="e-${k}">Campo obrigatório.</span></div>`;
  };
  openModal({ sub: id ? "Editar" : "Novo cadastro", title: `${id ? "Editar" : "Novo(a)"} ${spec.t}`, body: `<form id="gform" class="form-grid">${spec.f.map(field).join("")}${entity === "manutencoes" ? `<div class="field full"><label>Custo total</label><div class="input" id="mtotal" style="display:flex;align-items:center;font-weight:700">${BRL(manCost(v))}</div></div>` : ""}</form>`,
    foot: `<button class="btn ghost" data-close>Cancelar</button><button class="btn" id="gsave">${id ? "Salvar alterações" : `Criar ${spec.t}`}</button>`,
    onMount: w => {
      if (entity === "manutencoes") ["maoDeObra", "pecas", "outros"].forEach(k => w.querySelector("#f-" + k).addEventListener("input", () => { w.querySelector("#mtotal").textContent = BRL(["maoDeObra", "pecas", "outros"].reduce((s, x) => s + (+w.querySelector("#f-" + x).value || 0), 0)); }));

        let ok = true; const out = {};
        spec.f.forEach(([k, , type, req]) => { let x = w.querySelector("#f-" + k).value.trim(); const e = w.querySelector("#e-" + k); const miss = req && !x; e.classList.toggle("hidden", !miss); if (miss) ok = false;
          if (type === "number") x = x === "" ? 0 : +x.replace(",", "."); if (type === "list") x = x.split(",").map(s => s.trim()).filter(Boolean); if (k === "placa") x = x.toUpperCase(); out[k] = x; });

        if (rec) Object.assign(rec, out); else { const n = Object.assign({ id: uid(entity.slice(0, 2)) }, out); if (entity === "usuarios") Object.assign(n, { modulos: ["painel", "veiculos", "abastecimentos", "checklist"], ultimo: "" }); if (entity === "manutencoes") n.responsavel = ME().nome; if (entity === "abastecimentos") DB[entity].unshift(n); else DB[entity].push(n); }
        audit(spec.mod, spec.code, `${rec ? "atualizou" : "criou"} ${spec.t} ${spec.label(Object.assign({}, v, out))}`, "Alteração registrada em " + spec.mod + ".");

    } });

async function doExport(key, fmt) {
  const r = EXPORTS[key](); if (!r.rows.length) { toast(key === "abastSel" ? "Marque ao menos um lançamento na tabela." : "Não há itens para exportar com os filtros atuais.", "err"); return; }
  const base = `${r.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "-")}-${T0}`;
  if (fmt === "csv") { const q = x => `"${String(x).replace(/"/g, '""')}"`; return saveFile(base + ".csv", "\ufeff" + [r.cols, ...r.rows].map(row => row.map(q).join(";")).join("\r\n")); }
  if (fmt === "json") return saveFile(base + ".json", JSON.stringify(r.rows.map(row => Object.fromEntries(r.cols.map((c, i) => [c, row[i]]))), null, 2));
  if (fmt === "xlsx") { if (!window.XLSX) { toast("Exportação para Excel indisponível sem conexão.", "err"); return; } const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([r.cols, ...r.rows]); ws["!cols"] = r.cols.map(c => ({ wch: Math.max(12, c.length + 4) })); XLSX.utils.book_append_sheet(wb, ws, r.title.slice(0, 30)); return saveFile(base + ".xlsx", new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })])); }
  if (fmt === "pdf") { if (!window.jspdf) { toast("Gerador de PDF indisponível sem conexão.", "err"); return; } const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "a4" }); const W = doc.internal.pageSize.getWidth();
    doc.setFillColor(200, 16, 46); doc.rect(0, 0, W, 8, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text(`${CFG.nome} · ${r.title}`, 40, 44); doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(110); doc.text(`Gerado em ${fmtDateTime(new Date().toISOString())} · ${r.rows.length} registro(s) · Organização Demonstração`, 40, 60);
    doc.autoTable({ startY: 76, head: [r.cols], body: r.rows, styles: { fontSize: 8 }, headStyles: { fillColor: hexToRgb(CFG.primary), textColor: lum(CFG.primary) > .35 ? 20 : 255 }, alternateRowStyles: { fillColor: [246, 248, 250] } });
    return saveFile(base + ".pdf", doc.output("blob")); }
}

  if (t.dataset.form) { const [en, id] = t.dataset.form.split(":"); openForm(en, id); return; }
  if (t.dataset.del) { const [en, id] = t.dataset.del.split(":"); deleteRec(en, id); return; }
  if (t.dataset.export) { const [k, f] = t.dataset.export.split(":"); doExport(k, f); return; }
  if (t.dataset.ans) { const [k, v] = t.dataset.ans.split("|"); if (k === "__avaria") { DRAFT.temAvaria = v === "Sim"; if (DRAFT.temAvaria && !DRAFT.avarias.length) DRAFT.avarias.push(newAvaria()); } else DRAFT.respostas[k] = v; delete DRAFT_ERR["r_" + k]; rerender(); return; }
  if (t.dataset.avtipo) { const [i, v] = t.dataset.avtipo.split("|"); DRAFT.avarias[i].ui.tipo = v; rerender(); return; }
  if (t.dataset.avvista) { const [i, v] = t.dataset.avvista.split("|"); DRAFT.avarias[i].ui.vista = v; rerender(); return; }
  if (t.dataset.map !== undefined) { const a = DRAFT.avarias[+t.dataset.map]; const b = t.getBoundingClientRect(); const x = +((e.clientX - b.left) / b.width * 100).toFixed(1), y = +((e.clientY - b.top) / b.height * 100).toFixed(1);
    const near = a.marcas.findIndex(m => m.tipo === a.ui.tipo && m.vista === a.ui.vista && Math.hypot((m.x - x) * b.width / 100, (m.y - y) * b.height / 100) < 16);
    if (near >= 0) a.marcas.splice(near, 1); else a.marcas.push({ tipo: a.ui.tipo, vista: a.ui.vista, x, y }); rerender(); return; }
  const [act, arg] = t.dataset.act.split(":");
  const A = {
    logout: () => { LOGGED = false; store.del(KEY_LOGIN); alertShown = false; location.hash = ""; document.getElementById("root").innerHTML = ""; render(); },
    opennav: () => document.getElementById("app").classList.add("nav-open"), closenav: () => document.getElementById("app").classList.remove("nav-open"),
    senha: () => openModal({ title: "Minha senha", body: `<div class="stack"><div class="field"><label for="s1">Senha atual</label><input class="input" type="password" id="s1"></div><div class="field"><label for="s2">Nova senha</label><input class="input" type="password" id="s2"></div><div class="field"><label for="s3">Confirmar nova senha</label><input class="input" type="password" id="s3"></div></div>`, foot: `<button class="btn ghost" data-close>Cancelar</button><button class="btn" id="ss">Salvar nova senha</button>`, onMount: w => w.querySelector("#ss").onclick = () => { const a = w.querySelector("#s2").value, b = w.querySelector("#s3").value; if (a.length < 6) return toast("A nova senha precisa ter pelo menos 6 caracteres.", "err"); if (a !== b) return toast("A confirmação não confere com a nova senha.", "err"); closeModal(); toast("Senha alterada. Na demonstração, o acesso continua o mesmo."); } }),
    resetdb: () => confirmBox("Restaurar os dados de demonstração?", () => { DB = seedDB(); save(); DRAFT = null; selAbast.clear(); refreshShell(); toast("Dados de demonstração restaurados."); }, "Restaurar"),
    "painel-filtrar": () => { Object.assign(F.painel, { veiculo: val("fv"), ini: val("fi"), fim: val("ff"), centro: val("fc"), empresa: val("fe") }); rerender(); },
    "veic-filtrar": () => { Object.assign(F.veiculos, { q: val("vq"), empresa: val("ve"), status: val("vs") }); rerender(); },
    "mot-filtrar": () => { Object.assign(F.motoristas, { q: val("mq"), empresa: val("me") }); rerender(); },
    "abast-filtrar": () => { Object.assign(F.abast, { q: val("aq"), veiculo: val("av"), ini: val("ai"), fim: val("af") }); rerender(); },
    "abast-all": () => { const on = t.checked; document.querySelectorAll("[data-sel]").forEach(c => { c.checked = on; on ? selAbast.add(c.dataset.sel) : selAbast.delete(c.dataset.sel); }); rerender(); },
    "man-filtrar": () => { Object.assign(F.man, { ini: val("mi"), fim: val("mf"), veiculo: val("mv"), centro: val("mc"), empresa: val("mE") }); rerender(); },
    "ck-filtrar": () => { Object.assign(F.ck, { veiculo: val("kv"), ini: val("ki"), fim: val("kf") }); rerender(); },
    "cen-filtrar": () => { F.centros.q = val("cq"); rerender(); },
    "aud-filtrar": () => { Object.assign(F.aud, { mod: val("um"), quem: val("uq"), ini: val("ui"), fim: val("uf") }); rerender(); },
    "rel-filtrar": () => { Object.assign(F.rel, { empresa: val("re"), ini: val("ri"), fim: val("rf"), veiculo: val("rv"), motorista: val("rm"), centro: val("rc") }); rerender(); toast("Filtros aplicados aos modelos de relatório."); },
    "rel-salvar": () => openModal({ title: "Salvar filtros atuais", body: `<div class="field"><label for="rn">Nome do relatório</label><input class="input" id="rn" placeholder="Ex.: Custos do contrato Porto Norte"></div>`, foot: `<button class="btn ghost" data-close>Cancelar</button><button class="btn" id="rs">Salvar relatório</button>`, onMount: w => w.querySelector("#rs").onclick = () => { const n = w.querySelector("#rn").value.trim(); if (!n) return toast("Dê um nome ao relatório.", "err"); Object.assign(F.rel, { empresa: val("re"), ini: val("ri"), fim: val("rf"), veiculo: val("rv"), motorista: val("rm"), centro: val("rc") }); (DB.relSalvos = DB.relSalvos || []).push({ nome: n, f: Object.assign({}, F.rel) }); save(); closeModal(); rerender(); toast("Relatório salvo."); } }),
    "rel-aplicar": () => { Object.assign(F.rel, DB.relSalvos[+arg].f); rerender(); toast("Filtros do relatório aplicados."); },
    "rel-del": () => { DB.relSalvos.splice(+arg, 1); save(); rerender(); },
    empdash: () => empresaDash(arg), ficha: () => fichaVeiculo(arg), ckopen: () => openChecklist(arg), ckpdf: () => checklistPDF(arg), acessos: () => gerenciarAcessos(arg),

    cenveic: () => { const c = cen(arg), vs = DB.veiculos.filter(v => v.centro === arg); openModal({ sub: "Centro de custo " + c.codigo, title: esc(c.nome), body: vs.map(v => `<div class="stat-line"><span><b>${v.placa}</b> · ${esc(v.modelo)}</span>${statusTag(v.status)}</div>`).join("") || `<div class="empty">Nenhum veículo neste centro.</div>`, foot: `<span></span><button class="btn" data-close>Fechar</button>` }); },
    "alerta-toggle": () => { const a = byId("alertas", arg); a.status = a.status === "Aberto" ? "Encerrado" : "Aberto"; audit("Alertas", "AL", `${a.status === "Aberto" ? "reabriu" : "encerrou"} o alerta “${a.titulo}”`); save(); rerender(); toast(`Alerta ${a.status === "Aberto" ? "reaberto" : "encerrado"}.`); },
    "av-add": () => { DRAFT.avarias.push(newAvaria()); rerender(); },
    "av-del": () => { DRAFT.avarias.splice(+arg, 1); rerender(); },
    "av-clear": () => { DRAFT.avarias[+arg].marcas = []; rerender(); },
    "av-clearview": () => { const a = DRAFT.avarias[+arg]; a.marcas = a.marcas.filter(m => !(m.tipo === a.ui.tipo && m.vista === a.ui.vista)); rerender(); },
    "ck-finalizar": finalizarChecklist,
    "cfg-salvar": () => { CFG = Object.assign({}, PCFG); store.set(KEY_CFG, CFG); applyCfg(); audit("Personalização", "PE", "salvou a personalização do sistema", `Cores ${CFG.primary} · ${CFG.accent} · ${CFG.sidebar}`); save(); refreshShell(); toast("Personalização salva."); },
    "cfg-padrao": () => { CFG = Object.assign({}, DEFAULT_CFG); store.set(KEY_CFG, CFG); applyCfg(); refreshShell(); toast("Aparência padrão restaurada."); }
  };
  if (A[act]) A[act]();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.move) { moveMan(t.dataset.move, t.value); return; }
  if (t.dataset.sel) { t.checked ? selAbast.add(t.dataset.sel) : selAbast.delete(t.dataset.sel); rerender(); return; }
  if (t.dataset.photo) { const f = t.files[0]; if (f) readPhoto(f, url => { DRAFT.evid[t.dataset.photo] = url; delete DRAFT_ERR["e_" + t.dataset.photo]; rerender(); }); return; }
  if (t.dataset.draft === "veiculo") { DRAFT.veiculo = t.value; const v = byId("veiculos", t.value); if (v) { DRAFT.km = DRAFT.km || String(v.km); DRAFT.avarias.forEach(a => a.ui.tipo = v.tipo === "Moto" ? "moto" : "carro"); const d = DB.motoristas.find(m => m.veiculo === v.id && m.status === "Ativo"); if (d && !DRAFT.motorista) DRAFT.motorista = d.id; } rerender(); return; }
  if (t.dataset.draft === "motorista") { DRAFT.motorista = t.value; return; }
  if (t.dataset.av) { const [i, k] = t.dataset.av.split("|"); DRAFT.avarias[i][k] = t.value; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.draft && t.dataset.draft !== "veiculo" && t.dataset.draft !== "motorista") DRAFT[t.dataset.draft] = t.value;
  if (t.dataset.desc) DRAFT.desc[t.dataset.desc] = t.value;
  if (t.dataset.av) { const [i, k] = t.dataset.av.split("|"); DRAFT.avarias[i][k] = t.value; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.map !== undefined) { e.preventDefault(); toast("Use o clique ou toque sobre o desenho para marcar o ponto exato."); }
});
window.addEventListener("hashchange", () => { closeModal(); render(); const m = document.getElementById("main"); if (m) m.scrollTop = 0; });

applyCfg(); render();
